name: Build and Release Dar Al-Hikayat APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Verify Java toolchain
        run: |
          java -version
          javac -version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure and verify Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD secret'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/daralhikayat-release.keystore
          chmod 600 android/app/daralhikayat-release.keystore
          keytool -list -keystore android/app/daralhikayat-release.keystore \
            -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo 'Release keystore verified.'

      - name: Build Android APKs and App Bundle
        env:
          KEYSTORE_PATH: app/daralhikayat-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease assembleDebug

      - name: Prepare immutable release assets and metadata
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          set -euo pipefail
          RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)
          RELEASE_AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | sort | head -n 1)
          test -n "$RELEASE_APK" && test -f "$RELEASE_APK"
          test -n "$DEBUG_APK" && test -f "$DEBUG_APK"
          test -n "$RELEASE_AAB" && test -f "$RELEASE_AAB"
          rm -rf release-assets
          mkdir -p release-assets
          cp "$RELEASE_APK" release-assets/dar-al-hikayat.apk
          cp "$DEBUG_APK" release-assets/dar-al-hikayat-debug.apk
          cp "$RELEASE_AAB" release-assets/dar-al-hikayat.aab
          APK_SHA256=$(sha256sum release-assets/dar-al-hikayat.apk | awk '{print $1}')
          FILE_SIZE=$(wc -c < release-assets/dar-al-hikayat.apk | tr -d ' ')
          cat > release-assets/latest.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/msayed-io/Dar-Al-Hikayat/releases/latest/download/dar-al-hikayat.apk",
            "directDownloadUrl": "https://github.com/msayed-io/Dar-Al-Hikayat/releases/download/v1.0.$VERSION_CODE/dar-al-hikayat.apk",
            "sha256": "$APK_SHA256",
            "fileSizeBytes": $FILE_SIZE,
            "mandatory": false,
            "releaseNotes": [
              "تحسينات عامة على الأداء وسرعة الاستجابة",
              "تطوير وتحديث محراب الحكايات وأدوات التحرير الإبداعي",
              "تعزيز دقة حساب مواقيت الصلاة والأذكار والتنبيهات الموقوتة",
              "تحسين آلية التحديث التلقائي المباشر من داخل التطبيق"
            ],
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          jq empty release-assets/latest.json
          echo "Release APK SHA-256: $APK_SHA256"
          echo "Release APK bytes: $FILE_SIZE"

      - name: Upload APK, AAB, and metadata as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dar-al-hikayat-builds-${{ github.run_number }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: دار الحكايات - الإصدار الرسمي والتجريبي v1.0.${{ github.run_number }}
          body: |
            ### ملفات التطبيق الرسمية
            - Release APK: النسخة النهائية الموقعة.
            - Release AAB: حزمة Android الرسمية.
            - Debug APK: نسخة التجربة والاختبار.
            - Metadata: ملف معلومات الإصدار والتحقق الرقمي.
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
